apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redirect-service
  template:
    metadata:
      labels:
        app: redirect-service
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers:
        - name: redirect-service-container
          image: ghcr.io/alkamal30/shrink-link/redirect-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: GRPC_URL
              value: link-service:50051
            - name: REDIS_ADDRESS
              value: http://redis
            - name: KAFKA_BROKERS
              value: http://kafka
            - name: KAFKA_REDIRECTANALYTICSTOPIC
              value: redirect-analytics-topic