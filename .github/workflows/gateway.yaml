name: Gateway

on:
  push:
    branches: [ main ]
    paths:
      - "src/gateway/**"
      - "k8s/gateway/**"
      - ".github/workflows/gateway.yaml"
  workflow_dispatch:

jobs:
  run-pipeline:
    uses: ./.github/workflows/service-template.yaml
    with:
      service-name: gateway
    secrets: inherit