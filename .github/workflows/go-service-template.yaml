name: Golang Service CI/CD Template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      # Clone repository to VM
      - name: Checkout
        uses: actions/checkout@v4

      # Install Golang to VM
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: src/${{ inputs.service-name }}/go.sum

      # Restore dependencies
      - name: Restore Dependencies
        run: go mod download
        working-directory: src/${{ inputs.service-name }}

  docker-publish:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      repo: ${{ steps.lowercase.outputs.repo }}
    steps:
      # Clone repository to VM
      - name: Checkout
        uses: actions/checkout@v4

      # Create lower-case repository name
      - name: Lower-case repo name
        id: lowercase
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for new Docker image
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.lowercase.outputs.repo }}/${{ inputs.service-name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      # Build Docker image & Push to GitHub Container Registry
      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/${{ inputs.service-name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Kubernetes
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      # Clone repository to VM
      - name: Checkout
        uses: actions/checkout@v4

      # Install kubectl (Kubernetes client) to VM
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # Set config for kubectl (configuration for connection to a remote Kubernetes server)
      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      # Deploy service to Kubernetes
      - name: K3s deploy
        uses: azure/k8s-deploy@v5
        with:
          action: deploy
          manifests: |
            k8s/${{ inputs.service-name }}/deployment.yaml
            k8s/${{ inputs.service-name }}/service.yaml
          images: |
            ghcr.io/${{ needs.docker-publish.outputs.repo }}/${{ inputs.service-name }}:${{ needs.docker-publish.outputs.tag }}